<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zune Pulse - Live News & Current Affairs</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Atma:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: rgba(19, 27, 46, 0.75);
            --card-hover: rgba(28, 39, 64, 0.85);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f3f4f6;
            --text-subtle: #9ca3af;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.15);
            --accent-blue: #38bdf8;
            --tab-active: #059669;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
            --clock-face: rgba(17, 24, 39, 0.8);
            --header-bg: rgba(11, 15, 25, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans Bengali', sans-serif;
            background-color: var(--bg-color);
            /* High-definition abstract dark technology wallpaper with overlay */
            background-image: 
                radial-gradient(circle at center, rgba(8, 12, 20, 0.4) 0%, rgba(8, 12, 20, 0.95) 100%),
                url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* Header Bar */
        header {
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--card-border);
            padding: 10px 14px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 100%;
        }

        .header-content {
            max-width: 1140px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-family: 'Atma', cursive;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-blue);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .logo span {
            color: var(--accent);
        }

        /* Live Indicator Badge */
        .live-badge {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--accent);
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.3); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Sticky Note Button */
        .sticky-btn {
            background: linear-gradient(135deg, #facc15 0%, #eab308 100%);
            color: #0f172a;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.78rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(250, 204, 21, 0.25);
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        /* Sticky Drawer Window */
        .sticky-drawer {
            display: none;
            position: fixed;
            top: 60px;
            left: 14px;
            width: calc(100% - 28px);
            max-width: 300px;
            background: #fef08a;
            color: #0f172a;
            border-radius: 14px;
            padding: 14px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            z-index: 1001;
        }

        .sticky-drawer.active {
            display: block;
        }

        .sticky-drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding-bottom: 6px;
        }

        .sticky-close {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            color: #0f172a;
        }

        .sticky-textarea {
            width: 100%;
            height: 120px;
            background: transparent;
            border: none;
            resize: none;
            font-family: inherit;
            font-size: 0.88rem;
            color: #0f172a;
            outline: none;
        }

        /* Inline Header Clock */
        .clock-widget {
            width: 38px;
            height: 38px;
            background-color: var(--clock-face);
            border: 2px solid var(--accent-blue);
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            backdrop-filter: blur(8px);
        }

        .clock-number {
            position: absolute;
            font-size: 0.45rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1;
        }

        .num-12 { top: 2px; }
        .num-3  { right: 2px; }
        .num-6  { bottom: 2px; }
        .num-9  { left: 2px; }

        .clock-center {
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            z-index: 10;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            transform-origin: bottom;
            border-radius: 2px;
        }

        .hour-hand { width: 2px; height: 9px; background-color: var(--text-main); }
        .minute-hand { width: 1.5px; height: 12px; background-color: var(--accent-blue); }
        .second-hand { width: 1px; height: 14px; background-color: #f43f5e; }

        /* Section Navigation Tabs */
        .section-nav {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 20px auto 10px auto;
            max-width: 1140px;
            padding: 0 14px;
            width: 100%;
        }

        .nav-tab {
            flex: 1;
            padding: 12px 14px;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--card-bg);
            color: var(--text-subtle);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.2s ease;
        }

        .nav-tab.active {
            background-color: var(--tab-active);
            color: #ffffff;
            border-color: var(--tab-active);
            box-shadow: 0 4px 15px rgba(5, 150, 105, 0.3);
        }

        /* Refresh Status Sub-header */
        .refresh-status-bar {
            max-width: 1140px;
            margin: 0 auto 16px auto;
            padding: 0 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.76rem;
            color: var(--text-subtle);
        }

        .manual-refresh-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--accent-blue);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 600;
            backdrop-filter: blur(8px);
            transition: background 0.2s ease;
        }

        .manual-refresh-btn:hover {
            background: var(--card-hover);
        }

        /* Main Container */
        .main-container {
            max-width: 1140px;
            width: 100%;
            margin: 0 auto 30px auto;
            padding: 0 14px;
            flex: 1;
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
        }

        /* Responsive Grids */
        .news-grid, .ca-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            width: 100%;
        }

        .news-card, .ca-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow);
            width: 100%;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.2s ease, background-color 0.2s ease, border-color 0.2s ease;
        }

        .news-card:hover, .ca-card:hover {
            transform: translateY(-3px);
            background-color: var(--card-hover);
            border-color: rgba(56, 189, 248, 0.3);
        }

        .ca-card {
            border-left: 4px solid var(--accent);
        }

        .news-source, .ca-header {
            font-size: 0.75rem;
            color: var(--accent-blue);
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ca-tag {
            background-color: var(--accent-glow);
            color: var(--accent);
            padding: 3px 8px;
            border-radius: 12px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .news-title, .ca-title {
            font-size: 0.98rem;
            font-weight: 600;
            line-height: 1.45;
            margin-bottom: 10px;
        }

        .news-title a, .ca-title a {
            color: var(--text-main);
            text-decoration: none;
        }

        .ca-desc {
            font-size: 0.88rem;
            color: var(--text-subtle);
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .news-date, .ca-footer {
            font-size: 0.75rem;
            color: var(--text-subtle);
            border-top: 1px dashed var(--card-border);
            padding-top: 10px;
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ca-link {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 600;
        }

        /* Loading Sentinel */
        .loading-sentinel {
            text-align: center;
            padding: 24px;
            font-size: 0.85rem;
            color: var(--text-subtle);
            width: 100%;
        }

        footer {
            text-align: center;
            padding: 16px;
            font-size: 0.8rem;
            color: var(--text-subtle);
            border-top: 1px solid var(--card-border);
            background-color: var(--header-bg);
            backdrop-filter: blur(12px);
            margin-top: auto;
            width: 100%;
        }

        @media (max-width: 480px) {
            .header-content {
                gap: 6px;
            }
            .logo {
                font-size: 1.2rem;
            }
            .sticky-btn {
                padding: 5px 10px;
                font-size: 0.72rem;
            }
            .news-grid, .ca-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Sticky Note Drawer Window -->
    <div class="sticky-drawer" id="stickyDrawer">
        <div class="sticky-drawer-header">
            <span>📝 Notes</span>
            <button class="sticky-close" onclick="toggleStickyDrawer()">&times;</button>
        </div>
        <textarea class="sticky-textarea" id="stickyNotesText" placeholder="Write notes here..." oninput="saveNote()"></textarea>
    </div>

    <!-- Header Bar -->
    <header>
        <div class="header-content">
            <div class="header-left">
                <button class="sticky-btn" onclick="toggleStickyDrawer()">
                    📌 Notes
                </button>
                <a href="#" class="logo">
                    🌐 Zune <span>Pulse</span>
                </a>
            </div>

            <div class="header-right">
                <div class="live-badge">
                    <div class="live-dot"></div> LIVE
                </div>

                <div class="clock-widget" title="Live Clock">
                    <div class="clock-number num-12">12</div>
                    <div class="clock-number num-3">3</div>
                    <div class="clock-number num-6">6</div>
                    <div class="clock-number num-9">9</div>
                    <div class="clock-center"></div>
                    <div class="hand hour-hand" id="hourHand"></div>
                    <div class="hand minute-hand" id="minuteHand"></div>
                    <div class="hand second-hand" id="secondHand"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation Tabs -->
    <div class="section-nav">
        <button class="nav-tab active" onclick="switchSection('newsSection', this)">
            📰 Bengali News
        </button>
        <button class="nav-tab" onclick="switchSection('caSection', this)">
            📌 Current Affairs
        </button>
    </div>

    <!-- Live Refresh Info Bar -->
    <div class="refresh-status-bar">
        <span id="lastUpdatedText">Last updated: Fetching latest feeds...</span>
        <button class="manual-refresh-btn" onclick="forceRefreshAll()">🔄 Refresh Now</button>
    </div>

    <!-- Main Container -->
    <div class="main-container">

        <!-- SECTION 1: LIVE BENGALI NEWS GRID -->
        <section id="newsSection" class="content-section active">
            <div class="news-grid" id="newsGrid"></div>
            <div class="loading-sentinel" id="newsLoader">Fetching live daily updates...</div>
        </section>

        <!-- SECTION 2: ENGLISH CURRENT AFFAIRS GRID -->
        <section id="caSection" class="content-section">
            <div class="ca-list" id="caList"></div>
            <div class="loading-sentinel" id="caLoader">Fetching latest current affairs...</div>
        </section>

    </div>

    <footer>
        <p>Zune Pulse &copy; Real-Time News & Daily Current Affairs Portal</p>
    </footer>

    <script>
        let bengaliNews = [];
        let englishCA = [];

        let newsVisibleCount = 0;
        let caVisibleCount = 0;
        let activeTab = 'newsSection';
        let isLoading = false;

        function toggleStickyDrawer() {
            const drawer = document.getElementById('stickyDrawer');
            drawer.classList.toggle('active');
        }

        function saveNote() {
            const text = document.getElementById('stickyNotesText').value;
            localStorage.setItem('zune_sticky_notes', text);
        }

        function loadNote() {
            const saved = localStorage.getItem('zune_sticky_notes');
            if (saved) document.getElementById('stickyNotesText').value = saved;
        }

        function updateAnalogClock() {
            const now = new Date();
            const sec = now.getSeconds();
            const min = now.getMinutes();
            const hr = now.getHours();

            const secDeg = (sec / 60) * 360;
            const minDeg = ((min + sec / 60) / 60) * 360;
            const hrDeg = (((hr % 12) + min / 60) / 12) * 360;

            document.getElementById('secondHand').style.transform = `rotate(${secDeg}deg)`;
            document.getElementById('minuteHand').style.transform = `rotate(${minDeg}deg)`;
            document.getElementById('hourHand').style.transform = `rotate(${hrDeg}deg)`;
        }

        function switchSection(sectionId, btn) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
            
            document.getElementById(sectionId).classList.add('active');
            btn.classList.add('active');
            activeTab = sectionId;

            checkAndLoadMore();
        }

        const bengaliFeeds = [
            { name: 'Anandabazar Patrika', url: 'https://www.anandabazar.com/rss/west-bengal-rss-1.727192' },
            { name: 'Anandabazar Patrika', url: 'https://www.anandabazar.com/rss/national-rss-1.727196' },
            { name: 'Sangbad Pratidin', url: 'https://www.sangbadpratidin.in/feed/' },
            { name: 'ABP Ananda', url: 'https://bengali.abplive.com/home/feed' },
            { name: 'Aaj Tak Bangla', url: 'https://bangla.aajtak.in/rss/feeds' }
        ];

        const englishCAFeeds = [
            { name: 'The Hindu', url: 'https://www.thehindu.com/news/national/feeder/default.rss' },
            { name: 'The Hindu', url: 'https://www.thehindu.com/news/international/feeder/default.rss' },
            { name: 'Hindustan Times', url: 'https://www.hindustantimes.com/feeds/rss/india-news/rssfeed.xml' },
            { name: 'The Indian Express', url: 'https://indianexpress.com/section/india/feed/' }
        ];

        async function fetchWithTimeout(url, timeoutMs = 4000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(url, { signal: controller.signal });
                clearTimeout(timer);
                return res;
            } catch (err) {
                clearTimeout(timer);
                throw err;
            }
        }

        async function fetchSingleBengaliFeed(feed) {
            const cacheBuster = Date.now();
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}&_cb=${cacheBuster}`;
            
            try {
                const res = await fetchWithTimeout(apiUrl);
                const data = await res.json();
                if (data && data.items) {
                    return data.items.map(item => ({
                        title: item.title,
                        link: item.link,
                        pubDate: item.pubDate,
                        source: feed.name
                    }));
                }
            } catch (e) {
                try {
                    const fallbackUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(feed.url)}&_cb=${cacheBuster}`;
                    const res = await fetchWithTimeout(fallbackUrl);
                    const xmlText = await res.text();
                    const parser = new DOMParser();
                    const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                    const xmlItems = xmlDoc.querySelectorAll("item");
                    let items = [];
                    xmlItems.forEach(item => {
                        const title = item.querySelector("title")?.textContent || '';
                        const link = item.querySelector("link")?.textContent || '';
                        const pubDate = item.querySelector("pubDate")?.textContent || '';
                        if (title) items.push({ title, link, pubDate, source: feed.name });
                    });
                    return items;
                } catch (fallbackErr) {
                    return [];
                }
            }
            return [];
        }

        async function fetchBengaliNews() {
            bengaliNews = [];
            const promises = bengaliFeeds.map(feed => fetchSingleBengaliFeed(feed));
            const results = await Promise.allSettled(promises);

            results.forEach(res => {
                if (res.status === 'fulfilled' && Array.isArray(res.value)) {
                    bengaliNews.push(...res.value);
                }
            });

            const uniqueMap = new Map();
            bengaliNews.forEach(item => {
                if (item.title && !uniqueMap.has(item.title)) {
                    uniqueMap.set(item.title, item);
                }
            });

            bengaliNews = Array.from(uniqueMap.values());
            bengaliNews.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

            newsVisibleCount = 0;
            document.getElementById('newsGrid').innerHTML = '';
            renderMoreNews(50);
            updateTimestampDisplay();
        }

        async function fetchSingleEnglishFeed(feed) {
            const cacheBuster = Date.now();
            const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}&_cb=${cacheBuster}`;
            try {
                const res = await fetchWithTimeout(apiUrl);
                const data = await res.json();
                if (data && data.items) {
                    return data.items.map(item => ({
                        title: item.title,
                        link: item.link,
                        pubDate: item.pubDate,
                        source: feed.name,
                        description: item.description || item.content || ''
                    }));
                }
            } catch (e) {
                return [];
            }
            return [];
        }

        async function fetchEnglishCurrentAffairs() {
            englishCA = [];
            const promises = englishCAFeeds.map(feed => fetchSingleEnglishFeed(feed));
            const results = await Promise.allSettled(promises);

            results.forEach(res => {
                if (res.status === 'fulfilled' && Array.isArray(res.value)) {
                    englishCA.push(...res.value);
                }
            });

            const uniqueMap = new Map();
            englishCA.forEach(item => {
                if (item.title && !uniqueMap.has(item.title)) {
                    uniqueMap.set(item.title, item);
                }
            });
            englishCA = Array.from(uniqueMap.values());
            englishCA.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

            caVisibleCount = 0;
            document.getElementById('caList').innerHTML = '';
            renderMoreCA(50);
            updateTimestampDisplay();
        }

        function renderMoreNews(batchCount = 18) {
            const grid = document.getElementById('newsGrid');
            const loader = document.getElementById('newsLoader');

            if (bengaliNews.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-subtle); padding: 30px 0;">No new updates available right now.</div>';
                loader.style.display = 'none';
                return;
            }

            const nextBatch = bengaliNews.slice(newsVisibleCount, newsVisibleCount + batchCount);

            nextBatch.forEach(item => {
                const card = document.createElement('div');
                card.className = 'news-card';
                card.innerHTML = `
                    <div>
                        <div class="news-source">📌 ${escapeHtml(item.source)}</div>
                        <div class="news-title">
                            <a href="${item.link}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a>
                        </div>
                    </div>
                    <div class="news-date">🕒 ${formatDate(item.pubDate)}</div>
                `;
                grid.appendChild(card);
            });

            newsVisibleCount += nextBatch.length;

            if (newsVisibleCount >= bengaliNews.length) {
                loader.innerText = 'You are all caught up with live news for today.';
            } else {
                loader.innerText = `Showing ${newsVisibleCount} of ${bengaliNews.length} news — Scroll for more...`;
            }
        }

        function renderMoreCA(batchCount = 18) {
            const caList = document.getElementById('caList');
            const loader = document.getElementById('caLoader');

            if (englishCA.length === 0) {
                caList.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-subtle); padding: 30px 0;">No current affairs available.</div>';
                loader.style.display = 'none';
                return;
            }

            const nextBatch = englishCA.slice(caVisibleCount, caVisibleCount + batchCount);

            nextBatch.forEach(item => {
                let cleanDesc = item.description.replace(/<[^>]*>?/gm, '').trim();
                let words = cleanDesc.split(/\s+/);
                let summaryText = words.length > 30 ? words.slice(0, 30).join(' ') + '...' : cleanDesc;

                if (!summaryText || summaryText.length < 15) {
                    summaryText = `${item.title} — Key daily national update for competitive exams and general awareness. Read full story below.`;
                }

                const card = document.createElement('div');
                card.className = 'ca-card';
                card.innerHTML = `
                    <div>
                        <div class="ca-header">
                            <span class="ca-tag">Current Affairs</span>
                            <span style="font-size:0.75rem; color:var(--text-subtle);">${formatDate(item.pubDate)}</span>
                        </div>
                        <div class="ca-title">
                            <a href="${item.link}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a>
                        </div>
                        <div class="ca-desc">${escapeHtml(summaryText)}</div>
                    </div>
                    <div class="ca-footer">
                        <span>Source: ${escapeHtml(item.source)}</span>
                        <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="ca-link">Read More →</a>
                    </div>
                `;
                caList.appendChild(card);
            });

            caVisibleCount += nextBatch.length;

            if (caVisibleCount >= englishCA.length) {
                loader.innerText = 'You are all caught up with live current affairs for today.';
            } else {
                loader.innerText = `Showing ${caVisibleCount} of ${englishCA.length} updates — Scroll for more...`;
            }
        }

        function checkAndLoadMore() {
            if (isLoading) return;

            const scrollPosition = window.innerHeight + window.scrollY;
            const threshold = document.documentElement.offsetHeight - 600;

            if (scrollPosition >= threshold) {
                isLoading = true;
                if (activeTab === 'newsSection' && newsVisibleCount < bengaliNews.length) {
                    renderMoreNews(18);
                } else if (activeTab === 'caSection' && caVisibleCount < englishCA.length) {
                    renderMoreCA(18);
                }
                setTimeout(() => { isLoading = false; }, 200);
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'Today';
            const d = new Date(dateStr);
            return isNaN(d) ? 'Today' : d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function escapeHtml(text) {
            return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }

        function updateTimestampDisplay() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('lastUpdatedText').innerText = `Last updated today at ${timeString}`;
        }

        function forceRefreshAll() {
            document.getElementById('lastUpdatedText').innerText = 'Updating feeds live...';
            fetchBengaliNews();
            fetchEnglishCurrentAffairs();
        }

        window.onscroll = checkAndLoadMore;
        window.onresize = checkAndLoadMore;

        window.onload = () => {
            loadNote();
            setInterval(updateAnalogClock, 1000);
            updateAnalogClock();

            fetchBengaliNews();
            fetchEnglishCurrentAffairs();

            setInterval(fetchBengaliNews, 180000);
            setInterval(fetchEnglishCurrentAffairs, 180000);
        };
    </script>
</body>
</html>
