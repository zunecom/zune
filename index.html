<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zune Pulse - Live News, Markets & Sports</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Atma:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080c14;
            --card-bg: rgba(19, 27, 46, 0.75);
            --card-hover: rgba(28, 39, 64, 0.9);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-subtle: #9ca3af;
            --accent: #10b981;
            --accent-glow: rgba(16, 185, 129, 0.15);
            --accent-blue: #38bdf8;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
            --clock-face: rgba(17, 24, 39, 0.8);
            --header-bg: rgba(11, 15, 25, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html { scroll-behavior: smooth; }

        html, body {
            width: 100%;
            max-width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans Bengali', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at center, rgba(8, 12, 20, 0.4) 0%, rgba(8, 12, 20, 0.95) 100%),
                url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--card-border);
            padding: 10px 14px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 100%;
        }

        .header-content {
            max-width: 1140px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        .header-left, .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-family: 'Atma', cursive;
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-blue);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .logo:active { transform: scale(0.95); }
        .logo span { color: var(--accent); }

        .live-badge {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid var(--accent);
            color: var(--accent);
            font-size: 0.72rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .live-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(1.3); }
            100% { opacity: 1; transform: scale(1); }
        }

        .sticky-btn {
            background: linear-gradient(135deg, #facc15 0%, #eab308 100%);
            color: #0f172a;
            border: none;
            padding: 7px 15px;
            border-radius: 20px;
            font-family: inherit;
            font-weight: 700;
            font-size: 0.78rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(250, 204, 21, 0.25);
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .sticky-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 6px 18px rgba(250, 204, 21, 0.4);
        }

        .sticky-btn:active { transform: translateY(1px) scale(0.94); }

        .sticky-drawer {
            display: none;
            position: fixed;
            top: 60px;
            left: 14px;
            width: calc(100% - 28px);
            max-width: 320px;
            background: #fef08a;
            color: #0f172a;
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 20px 30px -5px rgba(0, 0, 0, 0.6);
            z-index: 1001;
            transform-origin: top left;
            animation: drawerOpen 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes drawerOpen {
            from { opacity: 0; transform: scale(0.9) translateY(-10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .sticky-drawer.active { display: block; }

        .sticky-drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding-bottom: 6px;
        }

        .sticky-close {
            background: rgba(0, 0, 0, 0.08);
            border: none;
            font-size: 1.1rem;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            cursor: pointer;
            color: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .sticky-textarea {
            width: 100%;
            height: 130px;
            background: transparent;
            border: none;
            resize: none;
            font-family: inherit;
            font-size: 0.88rem;
            color: #0f172a;
            outline: none;
        }

        .clock-widget {
            width: 38px;
            height: 38px;
            background-color: var(--clock-face);
            border: 2px solid var(--accent-blue);
            border-radius: 50%;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
            backdrop-filter: blur(8px);
        }

        .clock-number {
            position: absolute;
            font-size: 0.45rem;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1;
        }

        .num-12 { top: 2px; }
        .num-3  { right: 2px; }
        .num-6  { bottom: 2px; }
        .num-9  { left: 2px; }

        .clock-center {
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            z-index: 10;
        }

        .hand {
            position: absolute;
            bottom: 50%;
            transform-origin: bottom;
            border-radius: 2px;
            will-change: transform;
        }

        .hour-hand { width: 2px; height: 9px; background-color: var(--text-main); }
        .minute-hand { width: 1.5px; height: 12px; background-color: var(--accent-blue); }
        .second-hand { width: 1px; height: 14px; background-color: #f43f5e; }

        .section-nav {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin: 20px auto 10px auto;
            max-width: 1140px;
            padding: 0 14px;
            width: 100%;
        }

        .nav-tab {
            padding: 10px 6px;
            font-size: 0.78rem;
            font-weight: 700;
            font-family: 'Plus Jakarta Sans', sans-serif;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
            white-space: nowrap;
            user-select: none;
            outline: none;
        }

        .nav-tab:active { transform: scale(0.92) !important; }

        .nav-tab.tab-ca {
            background-color: rgba(16, 185, 129, 0.12);
            color: #6ee7b7;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }
        .nav-tab.tab-ca.active, .nav-tab.tab-ca:hover {
            background-color: #10b981;
            color: #ffffff;
            border-color: #10b981;
            box-shadow: 0 4px 18px rgba(16, 185, 129, 0.45);
        }

        .nav-tab.tab-bengali {
            background-color: rgba(56, 189, 248, 0.12);
            color: #7dd3fc;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }
        .nav-tab.tab-bengali.active, .nav-tab.tab-bengali:hover {
            background-color: #0284c7;
            color: #ffffff;
            border-color: #0284c7;
            box-shadow: 0 4px 18px rgba(2, 132, 199, 0.45);
        }

        .nav-tab.tab-stock {
            background-color: rgba(245, 158, 11, 0.12);
            color: #fcd34d;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }
        .nav-tab.tab-stock.active, .nav-tab.tab-stock:hover {
            background-color: #d97706;
            color: #ffffff;
            border-color: #d97706;
            box-shadow: 0 4px 18px rgba(217, 119, 6, 0.45);
        }

        .nav-tab.tab-ent {
            background-color: rgba(236, 72, 153, 0.12);
            color: #f472b6;
            border: 1px solid rgba(236, 72, 153, 0.3);
        }
        .nav-tab.tab-ent.active, .nav-tab.tab-ent:hover {
            background-color: #db2777;
            color: #ffffff;
            border-color: #db2777;
            box-shadow: 0 4px 18px rgba(219, 39, 119, 0.45);
        }

        .nav-tab.tab-sports {
            background-color: rgba(239, 68, 68, 0.12);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .nav-tab.tab-sports.active, .nav-tab.tab-sports:hover {
            background-color: #dc2626;
            color: #ffffff;
            border-color: #dc2626;
            box-shadow: 0 4px 18px rgba(220, 38, 38, 0.45);
        }

        .refresh-status-bar {
            max-width: 1140px;
            margin: 0 auto 16px auto;
            padding: 0 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.76rem;
            color: var(--text-subtle);
        }

        .manual-refresh-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--accent-blue);
            padding: 6px 14px;
            border-radius: 12px;
            font-size: 0.75rem;
            cursor: pointer;
            font-weight: 600;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .main-container {
            max-width: 1140px;
            width: 100%;
            margin: 0 auto 30px auto;
            padding: 0 14px;
            flex: 1;
        }

        .content-section {
            display: none;
            animation: fadeInSection 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes fadeInSection {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content-section.active { display: block; }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
            width: 100%;
        }

        .news-card {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 0;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow);
            width: 100%;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            contain: content;
        }

        .news-card:hover {
            transform: translateY(-4px);
            background-color: var(--card-hover);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .card-stock { border-left: 4px solid #f59e0b; }
        .card-ent { border-left: 4px solid #ec4899; }
        .card-ca { border-left: 4px solid var(--accent); }
        .card-sports { border-left: 4px solid #ef4444; }

        .card-img-container {
            width: 100%;
            height: 160px;
            overflow: hidden;
            position: relative;
            background-color: rgba(0, 0, 0, 0.3);
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.35s ease;
        }

        .news-card:hover .card-img { transform: scale(1.06); }

        .card-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .news-source {
            font-size: 0.75rem;
            color: var(--accent-blue);
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .news-tag {
            background-color: var(--accent-glow);
            color: var(--accent);
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 700;
        }

        .news-title {
            font-size: 0.98rem;
            font-weight: 600;
            line-height: 1.45;
            margin-bottom: 10px;
        }

        .news-title a {
            color: var(--text-main);
            text-decoration: none;
        }

        .news-title a:hover { color: var(--accent-blue); }

        .news-desc {
            font-size: 0.88rem;
            color: var(--text-subtle);
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .news-date {
            font-size: 0.75rem;
            color: var(--text-subtle);
            border-top: 1px dashed var(--card-border);
            padding-top: 10px;
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .news-link {
            color: var(--accent-blue);
            text-decoration: none;
            font-weight: 700;
        }

        .loading-sentinel {
            text-align: center;
            padding: 24px;
            font-size: 0.85rem;
            color: var(--text-subtle);
            width: 100%;
        }

        footer {
            text-align: center;
            padding: 16px;
            font-size: 0.8rem;
            color: var(--text-subtle);
            border-top: 1px solid var(--card-border);
            background-color: var(--header-bg);
            backdrop-filter: blur(12px);
            margin-top: auto;
            width: 100%;
        }

        @media (max-width: 1024px) { .section-nav { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 640px) { .section-nav { grid-template-columns: repeat(2, 1fr); } }
    </style>
</head>
<body>

    <div class="sticky-drawer" id="stickyDrawer">
        <div class="sticky-drawer-header">
            <span>📝 Notes</span>
            <button class="sticky-close" onclick="toggleStickyDrawer()">&times;</button>
        </div>
        <textarea class="sticky-textarea" id="stickyNotesText" placeholder="Write notes here..." oninput="saveNote()"></textarea>
    </div>

    <header>
        <div class="header-content">
            <div class="header-left">
                <button class="sticky-btn" onclick="toggleStickyDrawer()">📌 Notes</button>
                <a href="#" class="logo">🌐 Zune <span>Pulse</span></a>
            </div>

            <div class="header-right">
                <div class="live-badge"><div class="live-dot"></div> LIVE</div>
                <div class="clock-widget">
                    <div class="clock-number num-12">12</div>
                    <div class="clock-number num-3">3</div>
                    <div class="clock-number num-6">6</div>
                    <div class="clock-number num-9">9</div>
                    <div class="clock-center"></div>
                    <div class="hand hour-hand" id="hourHand"></div>
                    <div class="hand minute-hand" id="minuteHand"></div>
                    <div class="hand second-hand" id="secondHand"></div>
                </div>
            </div>
        </div>
    </header>

    <div class="section-nav">
        <button class="nav-tab tab-ca active" onclick="switchSection('caSection', this)">📌 Current Affairs</button>
        <button class="nav-tab tab-bengali" onclick="switchSection('newsSection', this)">📰 Bengali News</button>
        <button class="nav-tab tab-stock" onclick="switchSection('stockSection', this)">📈 Stock Market</button>
        <button class="nav-tab tab-ent" onclick="switchSection('entSection', this)">🎬 Entertainment</button>
        <button class="nav-tab tab-sports" onclick="switchSection('sportsSection', this)">⚽ Sports News</button>
    </div>

    <div class="refresh-status-bar">
        <span id="lastUpdatedText">Last updated: Fetching latest feeds...</span>
        <button class="manual-refresh-btn" onclick="forceRefreshAll()">🔄 Refresh Now</button>
    </div>

    <div class="main-container">
        <section id="caSection" class="content-section active">
            <div class="news-grid" id="caList"></div>
            <div class="loading-sentinel" id="caLoader">Fetching latest current affairs...</div>
        </section>

        <section id="newsSection" class="content-section">
            <div class="news-grid" id="newsGrid"></div>
            <div class="loading-sentinel" id="newsLoader">Fetching live daily updates...</div>
        </section>

        <section id="stockSection" class="content-section">
            <div class="news-grid" id="stockList"></div>
            <div class="loading-sentinel" id="stockLoader">Fetching latest market trends...</div>
        </section>

        <section id="entSection" class="content-section">
            <div class="news-grid" id="entList"></div>
            <div class="loading-sentinel" id="entLoader">Fetching movie & celeb updates...</div>
        </section>

        <section id="sportsSection" class="content-section">
            <div class="news-grid" id="sportsList"></div>
            <div class="loading-sentinel" id="sportsLoader">Fetching live ESPN sports updates...</div>
        </section>
    </div>

    <footer>
        <p>Zune Pulse &copy; Real-Time News, Markets & Sports Portal</p>
    </footer>

    <script>
        const store = {
            caSection: { feeds: [{ name: 'The Hindu', url: 'https://www.thehindu.com/news/national/feeder/default.rss' }, { name: 'Hindustan Times', url: 'https://www.hindustantimes.com/feeds/rss/india-news/rssfeed.xml' }, { name: 'The Indian Express', url: 'https://indianexpress.com/section/india/feed/' }], data: [], visible: 0, loaded: false, listId: 'caList', loaderId: 'caLoader', class: 'card-ca', tag: 'Current Affairs', tagClass: 'tag-ca', catKey: 'ca' },
            newsSection: { feeds: [{ name: 'Anandabazar Patrika', url: 'https://www.anandabazar.com/rss/west-bengal-rss-1.727192' }, { name: 'Sangbad Pratidin', url: 'https://www.sangbadpratidin.in/feed/' }, { name: 'ABP Ananda', url: 'https://bengali.abplive.com/home/feed' }, { name: 'Aaj Tak Bangla', url: 'https://bangla.aajtak.in/rss/feeds' }], data: [], visible: 0, loaded: false, listId: 'newsGrid', loaderId: 'newsLoader', class: '', tag: '', tagClass: '', catKey: 'bengali' },
            stockSection: { feeds: [{ name: 'Economic Times', url: 'https://economictimes.indiatimes.com/markets/stocks/rssfeeds/2146842.cms' }, { name: 'Livemint', url: 'https://www.livemint.com/rss/markets' }], data: [], visible: 0, loaded: false, listId: 'stockList', loaderId: 'stockLoader', class: 'card-stock', tag: 'Stock Market', tagClass: 'tag-stock', catKey: 'stock' },
            entSection: { feeds: [{ name: 'Bollywood Hungama', url: 'https://www.bollywoodhungama.com/feed/' }, { name: 'Pinkvilla', url: 'https://www.pinkvilla.com/feed' }], data: [], visible: 0, loaded: false, listId: 'entList', loaderId: 'entLoader', class: 'card-ent', tag: 'Entertainment', tagClass: 'tag-ent', catKey: 'ent' },
            sportsSection: { feeds: [{ name: 'ESPN India', url: 'https://www.espn.in/espn/rss/news' }], data: [], visible: 0, loaded: false, listId: 'sportsList', loaderId: 'sportsLoader', class: 'card-sports', tag: 'ESPN Sports', tagClass: 'tag-sports', catKey: 'sports' }
        };

        let activeTab = 'caSection', isLoading = false;

        const placeHolders = {
            'ca': 'https://images.unsplash.com/photo-1504711434969-e33886168f5c?q=80&w=600&auto=format&fit=crop',
            'bengali': 'https://images.unsplash.com/photo-1495020689067-958852a7765e?q=80&w=600&auto=format&fit=crop',
            'stock': 'https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?q=80&w=600&auto=format&fit=crop',
            'ent': 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=600&auto=format&fit=crop',
            'sports': 'https://images.unsplash.com/photo-1461896836934-ffe607ba8211?q=80&w=600&auto=format&fit=crop'
        };

        function toggleStickyDrawer() { document.getElementById('stickyDrawer').classList.toggle('active'); }
        function saveNote() { localStorage.setItem('zune_sticky_notes', document.getElementById('stickyNotesText').value); }
        function loadNote() { const saved = localStorage.getItem('zune_sticky_notes'); if (saved) document.getElementById('stickyNotesText').value = saved; }

        function updateAnalogClock() {
            const now = new Date();
            const sec = now.getSeconds(), min = now.getMinutes(), hr = now.getHours();
            document.getElementById('secondHand').style.transform = `rotate(${(sec / 60) * 360}deg)`;
            document.getElementById('minuteHand').style.transform = `rotate(${((min + sec / 60) / 60) * 360}deg)`;
            document.getElementById('hourHand').style.transform = `rotate(${(((hr % 12) + min / 60) / 12) * 360}deg)`;
        }

        async function switchSection(sectionId, btn) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(b => b.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');
            btn.classList.add('active');
            activeTab = sectionId;

            if (!store[sectionId].loaded) {
                await loadSectionData(sectionId);
            }
            checkAndLoadMore();
        }

        function extractImageUrl(item) {
            if (item.enclosure && item.enclosure.link && item.enclosure.link.match(/\.(jpeg|jpg|gif|png|webp)/i)) return item.enclosure.link;
            if (item.thumbnail) return item.thumbnail;
            const content = item.description || item.content || '';
            const match = content.match(/<img[^>]+src=["']([^"']+)["']/i);
            return match ? match[1] : null;
        }

        async function fetchWithTimeout(url, timeoutMs = 3500) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeoutMs);
            try {
                const res = await fetch(url, { signal: controller.signal });
                clearTimeout(timer);
                return res;
            } catch (err) {
                clearTimeout(timer);
                throw err;
            }
        }

        function parseXmlItems(items, sourceName) {
            return items.map(item => {
                const desc = item.querySelector("description")?.textContent || item.querySelector("encoded")?.textContent || '';
                const title = item.querySelector("title")?.textContent || '';
                const link = item.querySelector("link")?.textContent || '';
                const pubDate = item.querySelector("pubDate")?.textContent || new Date().toISOString();
                const enc = item.querySelector("enclosure")?.getAttribute("url");
                const thumb = item.querySelector("thumbnail")?.getAttribute("url");
                
                let imgUrl = enc || thumb;
                if (!imgUrl) {
                    const match = desc.match(/<img[^>]+src=["']([^"']+)["']/i);
                    if (match && match[1]) imgUrl = match[1];
                }

                return {
                    title: title.replace(/<!\[CDATA\[(.*?)\]\]>/g, '$1').trim(),
                    link: link.trim(),
                    pubDate: pubDate,
                    source: sourceName,
                    description: desc.replace(/<!\[CDATA\[(.*?)\]\]>/g, '$1').trim(),
                    image: imgUrl
                };
            });
        }

        async function fetchGenericFeed(feed) {
            // Adds timestamp parameter to completely avoid old cached versions
            const timestamp = new Date().getTime();

            try {
                const primaryApi = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(feed.url)}&_t=${timestamp}`;
                const res = await fetchWithTimeout(primaryApi, 3500);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.status === 'ok' && data.items && data.items.length > 0) {
                        return data.items.map(item => ({
                            title: item.title,
                            link: item.link,
                            pubDate: item.pubDate,
                            source: feed.name,
                            description: item.description || item.content || '',
                            image: extractImageUrl(item)
                        }));
                    }
                }
            } catch (e) {}

            try {
                const proxyApi = `https://corsproxy.io/?${encodeURIComponent(feed.url)}&_t=${timestamp}`;
                const res = await fetchWithTimeout(proxyApi, 3500);
                if (res.ok) {
                    const text = await res.text();
                    const xmlDoc = new DOMParser().parseFromString(text, "text/xml");
                    const items = Array.from(xmlDoc.querySelectorAll("item"));
                    if (items.length > 0) return parseXmlItems(items, feed.name);
                }
            } catch (e) {}

            return [];
        }

        async function loadSectionData(sectionKey, isBackground = false) {
            const sec = store[sectionKey];
            const promises = sec.feeds.map(feed => fetchGenericFeed(feed));
            const results = await Promise.allSettled(promises);

            let compiled = [];
            results.forEach(res => {
                if (res.status === 'fulfilled' && Array.isArray(res.value)) {
                    compiled.push(...res.value);
                }
            });

            if (compiled.length === 0) return;

            const uniqueMap = new Map();
            compiled.forEach(item => {
                if (item.title && !uniqueMap.has(item.title.trim())) {
                    uniqueMap.set(item.title.trim(), item);
                }
            });

            const freshData = Array.from(uniqueMap.values()).sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

            if (isBackground && sec.data.length > 0) {
                // Prepend brand new items that weren't in the list before
                const existingTitles = new Set(sec.data.map(i => i.title));
                const brandNewItems = freshData.filter(i => !existingTitles.has(i.title));
                if (brandNewItems.length > 0) {
                    sec.data = [...brandNewItems, ...sec.data];
                    if (activeTab === sectionKey) {
                        document.getElementById(sec.listId).innerHTML = '';
                        sec.visible = 0;
                        renderMoreItems(sectionKey, Math.max(18, sec.visible));
                    }
                }
            } else {
                sec.data = freshData;
                sec.visible = 0;
                sec.loaded = true;
                if (activeTab === sectionKey) {
                    document.getElementById(sec.listId).innerHTML = '';
                    renderMoreItems(sectionKey, 18);
                }
            }
            updateTimestampDisplay();
        }

        function renderMoreItems(sectionKey, batchCount = 18) {
            const sec = store[sectionKey];
            const container = document.getElementById(sec.listId);
            const loader = document.getElementById(sec.loaderId);

            if (!sec.data || sec.data.length === 0) {
                container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: var(--text-subtle); padding: 30px 0;">No updates available right now. Click "Refresh Now".</div>';
                loader.style.display = 'none';
                return;
            }

            loader.style.display = 'block';
            const nextBatch = sec.data.slice(sec.visible, sec.visible + batchCount);
            const fragment = document.createDocumentFragment();

            nextBatch.forEach(item => {
                let cleanDesc = item.description ? item.description.replace(/<[^>]*>?/gm, '').trim() : '';
                let words = cleanDesc.split(/\s+/);
                let summaryText = words.length > 25 ? words.slice(0, 25).join(' ') + '...' : cleanDesc;
                const imgSrc = item.image ? item.image : placeHolders[sec.catKey];

                const card = document.createElement('div');
                card.className = `news-card ${sec.class}`;
                card.innerHTML = `
                    <div class="card-img-container">
                        <img class="card-img" src="${imgSrc}" alt="${escapeHtml(item.title)}" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='${placeHolders[sec.catKey]}';">
                    </div>
                    <div class="card-body">
                        <div>
                            <div class="news-source">
                                <span>📌 ${escapeHtml(item.source)}</span>
                                ${sec.tag ? `<span class="news-tag ${sec.tagClass}">${sec.tag}</span>` : ''}
                            </div>
                            <div class="news-title">
                                <a href="${item.link}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a>
                            </div>
                            ${summaryText ? `<div class="news-desc">${escapeHtml(summaryText)}</div>` : ''}
                        </div>
                        <div class="news-date">
                            <span>🕒 ${formatDate(item.pubDate)}</span>
                            <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="news-link">Read →</a>
                        </div>
                    </div>
                `;
                fragment.appendChild(card);
            });

            container.appendChild(fragment);
            sec.visible += nextBatch.length;

            if (sec.visible >= sec.data.length) {
                loader.innerText = 'You are all caught up for today.';
            } else {
                loader.innerText = `Showing ${sec.visible} of ${sec.data.length} updates — Scroll for more...`;
            }
        }

        function checkAndLoadMore() {
            if (isLoading) return;
            const scrollPosition = window.innerHeight + window.scrollY;
            const threshold = document.documentElement.offsetHeight - 600;

            if (scrollPosition >= threshold) {
                isLoading = true;
                const sec = store[activeTab];
                if (sec.loaded && sec.visible < sec.data.length) {
                    renderMoreItems(activeTab, 18);
                }
                setTimeout(() => { isLoading = false; }, 200);
            }
        }

        function formatDate(dateStr) {
            if (!dateStr) return 'Today';
            const d = new Date(dateStr);
            return isNaN(d) ? 'Today' : d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
        }

        function escapeHtml(text) {
            return text ? text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
        }

        function updateTimestampDisplay() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
            document.getElementById('lastUpdatedText').innerText = `Last updated today at ${timeString}`;
        }

        function forceRefreshAll() {
            document.getElementById('lastUpdatedText').innerText = 'Updating feeds live...';
            Object.keys(store).forEach(k => { store[k].loaded = false; });
            loadSectionData(activeTab);
        }

        // Automatic background live poller to fetch updates whenever new items drop
        function startBackgroundPoller() {
            setInterval(() => {
                Object.keys(store).forEach(sectionKey => {
                    if (store[sectionKey].loaded) {
                        loadSectionData(sectionKey, true);
                    }
                });
            }, 300000); // Checks every 5 minutes
        }

        window.onscroll = checkAndLoadMore;
        window.onresize = checkAndLoadMore;

        window.onload = () => {
            loadNote();
            setInterval(updateAnalogClock, 1000);
            updateAnalogClock();
            loadSectionData('caSection');
            startBackgroundPoller();
        };
    </script>
